<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawimate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Drawimate</div>
    <div class="status" id="status">
      <span id="statStrokes">0 strokes</span>
      <span id="statFps">– fps</span>
    </div>
  </header>

  <div class="app">
    <!-- Left toolbar -->
    <nav class="toolbar" id="toolbar" aria-label="Tools">
      <div class="tool-group" id="brushTools">
        <button class="tool" data-tool="scribble" title="Scribble (1)">
          <svg viewBox="0 0 24 24"><path d="M3 15c2-4 3-8 5-7s-1 7 1 8 3-9 5-9 0 8 2 8 2-5 5-6"/></svg>
          <span>Scribble</span>
        </button>
        <button class="tool" data-tool="flow" title="Flow (2)">
          <svg viewBox="0 0 24 24"><path d="M3 16c3 0 4-8 9-8s6 8 9 8"/><path d="M3 12c3 0 4-5 9-5" opacity=".45"/></svg>
          <span>Flow</span>
        </button>
        <button class="tool" data-tool="particle" title="Particle (3)">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="15" r="1.4"/><circle cx="9" cy="10" r="1.2"/><circle cx="12" cy="16" r="1.6"/><circle cx="15" cy="8" r="1"/><circle cx="18" cy="13" r="1.4"/><circle cx="20" cy="6" r=".9"/></svg>
          <span>Particle</span>
        </button>
        <button class="tool" data-tool="smoke" title="Smoke (4)">
          <svg viewBox="0 0 24 24"><path d="M6 20c-2-3 2-4 0-7s2-5 1-8"/><path d="M12 20c-2-3 2-4 0-7s2-5 1-8" opacity=".6"/><path d="M18 20c-2-3 2-4 0-7s2-5 1-8" opacity=".35"/></svg>
          <span>Smoke</span>
        </button>
        <button class="tool" data-tool="pulse" title="Pulse (5)">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 3-8 2 3h4"/></svg>
          <span>Pulse</span>
        </button>
        <button class="tool" data-tool="eraser" title="Eraser — removes whole strokes (E)">
          <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6l-3-3z"/><path d="M9 20h12"/></svg>
          <span>Eraser</span>
        </button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tool" id="btnUndo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="btnRedo" title="Redo (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
          <span>Redo</span>
        </button>
        <button class="tool" id="btnClear" title="Clear layer">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          <span>Clear</span>
        </button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tool" id="btnPlay" title="Play / pause (Space)">
          <svg viewBox="0 0 24 24" class="ico-pause"><path d="M8 5v14M16 5v14"/></svg>
          <svg viewBox="0 0 24 24" class="ico-play"><path d="M7 5l12 7-12 7z"/></svg>
          <span>Pause</span>
        </button>
        <button class="tool" id="btnImage" title="Import background image">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.3"/></svg>
          <span>Image</span>
        </button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tool" id="btnSave" title="Save project (Ctrl+S)">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>
          <span>Save</span>
        </button>
        <button class="tool" id="btnLoad" title="Open project (Ctrl+O)">
          <svg viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M4 4h16"/></svg>
          <span>Open</span>
        </button>
      </div>
      <input type="file" id="fileImage" accept="image/*" hidden>
      <input type="file" id="fileProject" accept=".json,application/json" hidden>
    </nav>

    <!-- Canvas -->
    <main class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="cursor-ring" id="cursorRing"></div>
      <div class="toast" id="toast"></div>
    </main>

    <!-- Right panel -->
    <aside class="panel" id="panel">
      <section class="card" id="brushCard">
        <h2 id="brushTitle">Scribble</h2>
        <div id="brushControls">
          <label class="row color-row">
            <span>Color</span>
            <input type="color" id="ctlColor">
          </label>
          <label class="row"><span>Size</span><input type="range" id="ctlSize" min="1" max="80" step="0.5"><output></output></label>
          <label class="row"><span>Opacity</span><input type="range" id="ctlOpacity" min="0.05" max="1" step="0.01"><output></output></label>
          <label class="row"><span>Speed</span><input type="range" id="ctlSpeed" min="0" max="3" step="0.05"><output></output></label>
          <label class="row"><span>Amplitude</span><input type="range" id="ctlAmp" min="0" max="30" step="0.1"><output></output></label>
          <label class="row"><span>Frequency</span><input type="range" id="ctlFreq" min="0.1" max="5" step="0.05"><output></output></label>
        </div>
        <div id="eraserControls" hidden>
          <label class="row"><span>Size</span><input type="range" id="ctlEraser" min="4" max="80" step="1"><output></output></label>
          <p class="hint">Drag across strokes to remove them whole.</p>
        </div>
      </section>

      <section class="card" id="layersCard">
        <div class="card-head">
          <h2>Layers</h2>
          <div class="icon-btns">
            <button id="btnLayerAdd" title="Add layer">+</button>
            <button id="btnLayerUp" title="Move up">▲</button>
            <button id="btnLayerDown" title="Move down">▼</button>
            <button id="btnLayerDel" title="Delete layer">✕</button>
          </div>
        </div>
        <ul class="layers" id="layerList"></ul>
      </section>

      <section class="card">
        <h2>Canvas</h2>
        <label class="row color-row"><span>Background</span><input type="color" id="ctlBg"></label>
        <label class="row select-row"><span>Size</span>
          <select id="ctlCanvasSize">
            <option value="1280x720">1280 × 720</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="1080x1080">1080 × 1080</option>
            <option value="1080x1920">1080 × 1920</option>
          </select>
        </label>
        <label class="row"><span>Loop</span><input type="range" id="ctlLoop" min="2" max="10" step="1"><output></output></label>
      </section>

      <section class="card">
        <h2>Export</h2>
        <label class="row select-row"><span>Frame rate</span>
          <select id="ctlFps">
            <option value="12">12 fps</option>
            <option value="24">24 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn primary" id="btnWebm">Record WebM</button>
          <button class="btn" id="btnZip">PNG frames .zip</button>
        </div>
        <p class="hint">Exports one seamless loop of the length set above.</p>
      </section>
    </aside>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div id="modalText">Exporting…</div>
      <div class="progress"><div id="modalBar"></div></div>
      <button class="btn" id="modalCancel">Cancel</button>
    </div>
  </div>

  <script src="js/noise.js"></script>
  <script src="js/brushes.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
